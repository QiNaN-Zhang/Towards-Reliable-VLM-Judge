name: Bug Report
description: Report a bug in generation, inference, scoring, or the documentation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as
        you can — generation, inference and scoring all log useful details
        (`logs/`, `scoring.log`, `scoring_receipt.json`, `run_summary.json`).

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which workflow is affected?
      options:
        - Generation (MiniGrid / Scale-2)
        - Generation (MiniWorld)
        - Generation (Habitat / HSSD)
        - Inference (scripts/infer.sh, tools/inference)
        - Scoring (scripts/score.sh, tools/scoring)
        - Experiment builder (structured-cot / oracle-state / matched-probes)
        - Environment setup (conda envs, requirements)
        - Documentation / README
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The commit SHA or tag you are running (output of `git rev-parse --short HEAD`).
      placeholder: e.g. abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, conda environment (core / habitat), renderer (software / gpu / d3d12), and model/provider if inference-related.
      value: |
        - OS:
        - Conda env (core/habitat):
        - Renderer (if Habitat):
        - Model / API provider (if inference):
      render: markdown
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, from the repository root.
      placeholder: |
        1. bash scripts/generate_minigrid.sh --profile smoke --output ...
        2. bash scripts/infer.sh --requests ... --dry-run
        3. ...
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Paste relevant log output, error messages, or `run_summary.json` / `scoring_receipt.json` contents.
      render: markdown
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight checks
      options:
        - label: I ran the command from the repository root
        - label: I used a fresh output directory for scoring / experiment builders
        - label: For `--resume`, code, configuration, seed, interpreter and renderer match the original run
        - label: I checked existing issues (open and closed) for a duplicate
